name: Release Phant

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Ensure AWS CLI is available
        run: |
          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi

          python -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build AppImage (Linux x86_64)
        run: wails3 task linux:create:appimage VERSION=${{ github.ref_name }}

      - name: Remove intermediate standalone binary
        run: rm -f bin/phant

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # 1. Upload the permanent archived version
          aws s3 cp bin/phant-${{ github.ref_name }}-x86_64.AppImage s3://phant-releases/phant-${{ github.ref_name }}-x86_64.AppImage \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

          # 2. Copy it to 'latest' so your Worker can easily serve it
          aws s3 cp s3://phant-releases/phant-${{ github.ref_name }}-x86_64.AppImage s3://phant-releases/phant-latest-x86_64.AppImage \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

  update-website-manifest:
    runs-on: ubuntu-latest
    needs: build-and-upload
    if: ${{ success() }}
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: phant-app/phant-app.github.io
          token: ${{ secrets.WEBSITE_PAT }}
          path: website

      - name: Update website manifest
        env:
          VERSION: ${{ github.ref_name }}
        working-directory: website
        run: |
          # Normalize tag: v1.2.3 -> 1.2.3
          VERSION_CLEAN="${VERSION#v}"

          jq --arg version "$VERSION_CLEAN" \
            '.version = $version' \
            src/data/update.json > tmp.json && mv tmp.json src/data/update.json

          if git diff --quiet -- src/data/update.json; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/update.json
          git commit -m "chore(release): update manifest to $VERSION_CLEAN"
          git push origin main
